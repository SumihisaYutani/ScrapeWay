<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{--bg:#fbfaf7;--fg:#222;--sub:#6b6b6b;--line:#e2ded6;--accent:#2a6fb0;--fs:18px}
:root[data-theme=sepia]{--bg:#f4ecd8;--fg:#3b3024;--sub:#7a6a55;--line:#ddd0b3;--accent:#8a5a2b}
:root[data-theme=dark]{--bg:#1c1d20;--fg:#ddd;--sub:#999;--line:#34363b;--accent:#7fb2e5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Noto Serif JP",serif;font-size:var(--fs);line-height:1.95}
a{color:var(--accent)}
.bar{position:sticky;top:0;z-index:2;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 12px;background:var(--bg);border-bottom:1px solid var(--line);font:13px system-ui,sans-serif}
.bar .sp{flex:1}
.bar button{font:inherit;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--fg);cursor:pointer}
.wrap{max-width:40em;margin:0 auto;padding:24px 16px 80px}
header h1{font-size:1.5em;line-height:1.4;margin:.4em 0}
.info{font:13px/1.7 system-ui,sans-serif;color:var(--sub)}
.tag{display:inline-block;margin:0 6px 4px 0;padding:0 8px;border:1px solid var(--line);border-radius:10px}
.caption{white-space:pre-wrap;margin:12px 0;padding:12px;border-left:3px solid var(--line)}
.cover{max-width:180px;float:right;margin:0 0 12px 16px;border-radius:4px}
.series{display:flex;justify-content:space-between;gap:8px;font:14px system-ui,sans-serif;margin:16px 0;padding:8px 0;border-block:1px solid var(--line);clear:both}
.nav-dis{color:var(--sub);opacity:.5}
.text{clear:both}
.page{white-space:pre-wrap;word-break:break-word;margin:2em 0}
.page+.page{border-top:1px dashed var(--line);padding-top:2em}
.page h2{font-size:1.25em;margin:.5em 0 1em}
figure{margin:1em 0;text-align:center} figure img{max-width:100%;max-height:90vh}
rt{font-size:.5em}
body.vertical .wrap{max-width:none}
body.vertical .text{writing-mode:vertical-rl;width:100%;height:calc(100vh - 110px);overflow-x:auto;overflow-y:hidden;padding:0 8px}
body.vertical .page{margin:0 1.5em}
body.vertical .page+.page{border-top:0;border-right:1px dashed var(--line);padding:0 2em 0 0}
body.vertical figure img{max-height:70vh;max-width:none}
body.vertical header,body.vertical .series.top{display:none}
</style></head>
<body>
<div class="bar">
  <span class="sp"></span>
  <button id="vert">縦書き</button>
  <button id="smaller">A−</button><button id="larger">A＋</button>
  <button id="theme">配色</button>
</div>
<div class="wrap">
<header>
  {{COVER}}
  <h1>{{TITLE}}</h1>
  <div class="info">
    <div>作者: {{AUTHOR}}　投稿: {{CREATED}}　更新: {{UPDATED}}　{{CHARS}}字</div>
    <div>{{TAGS}}</div>
    <div>元の作品: <a href="https://www.pixiv.net/novel/show.php?id={{ID}}" target="_blank" rel="noopener">pixiv.net/novel/show.php?id={{ID}}</a></div>
  </div>
  {{CAPTION}}
</header>
{{SERIES_TOP}}
<main class="text" id="text">
{{BODY}}
</main>
{{SERIES}}
</div>
<script>
(() => {
  const root = document.documentElement, body = document.body, text = document.getElementById('text');
  let s = { fs: 18, theme: '', vertical: false };
  try { Object.assign(s, JSON.parse(localStorage.getItem('sw-reader') || '{}')); } catch (_) {}
  const themes = ['', 'sepia', 'dark'];
  const apply = () => {
    root.style.setProperty('--fs', s.fs + 'px');
    if (s.theme) root.dataset.theme = s.theme; else delete root.dataset.theme;
    body.classList.toggle('vertical', s.vertical);
    document.getElementById('vert').textContent = s.vertical ? '横書き' : '縦書き';
    try { localStorage.setItem('sw-reader', JSON.stringify(s)); } catch (_) {}
  };
  document.getElementById('vert').onclick = () => { s.vertical = !s.vertical; apply(); };
  document.getElementById('smaller').onclick = () => { s.fs = Math.max(12, s.fs - 1); apply(); };
  document.getElementById('larger').onclick = () => { s.fs = Math.min(32, s.fs + 1); apply(); };
  document.getElementById('theme').onclick = () => { s.theme = themes[(themes.indexOf(s.theme) + 1) % themes.length]; apply(); };
  // 縦書き時はホイールで左右に送る
  text.addEventListener('wheel', ev => {
    if (!s.vertical || Math.abs(ev.deltaX) > Math.abs(ev.deltaY)) return;
    text.scrollLeft -= ev.deltaY; ev.preventDefault();
  }, { passive: false });
  apply();
})();
</script>
</body></html>
